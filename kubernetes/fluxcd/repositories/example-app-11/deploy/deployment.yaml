apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app-11
  labels:
    app: example-app-11
  namespace: default
spec:
  selector:
    matchLabels:
      app: example-app-11
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: example-app-11
    spec:
      containers:
      - name: example-app-11
        image: example-app-1:0.0.11
        ports:
        - containerPort: 5001
        volumeMounts:
        - name: config-volume
          mountPath: /configs/
      volumes:
      - name: config-volume
        configMap:
          name: example-app-11
